# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# for vim
set -g @resurrect-strategy-vim 'session'
# for neovim
set -g @resurrect-strategy-nvim 'session'

#-- base settings --#
set -g default-terminal "xterm-256color"
set-option -sa terminal-overrides ",xterm*:Tc"
set -g display-time 3000
set -g escape-time 0
set -g history-limit 65535
set -g base-index 1
set -g pane-base-index 1

# set-option -g default-command "exec /bin/bash"

set -g default-shell /bin/zsh
set -g default-command /bin/zsh

#-- bindkeys --#
# prefix key (Ctrl+a)
set -g prefix ^a
unbind ^b
bind a send-prefix

# split window
unbind '"'
#vertical split (prefix -)
bind '-' splitw -v -c "#{pane_current_path}"
unbind %
# horizontal split (prefix |)
bind '|' splitw -h -c "#{pane_current_path}"

# select pane (vim mode)
bind k selectp -U # above (prefix k)
bind j selectp -D # below (prefix j)
bind h selectp -L # left (prefix h)
bind l selectp -R # right (prefix l)

#-- statusbar --#
#set -g status-utf8 on
set -g status-interval 1
set -g status-keys vi

setw -g mode-keys vi
setw -g automatic-rename off

# modes
setw -g clock-mode-colour colour223
setw -g mode-style fg=colour223,bg=colour235,bold

# panes
set -g pane-border-style fg=colour243,bg=colour0
set -g pane-active-border-style fg=colour26,bg=colour0

# statusbar
set -g status on
set -g status-justify centre
set -g status-style fg=colour248,bg=colour235,dim

setw -g window-status-current-style fg=colour223,bg=colour237,bold
setw -g window-status-current-format "#I:#W#F"

# messages
set -g message-style fg=colour223,bg=colour235,bold

set -g visual-activity on

#-- mouse --#
#setw -g mouse-resize-pane on
#setw -g mouse-select-pane on
#setw -g mouse-select-window on
set -g mouse on

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
